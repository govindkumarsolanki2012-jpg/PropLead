name: Build PropLead Android

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get PropLead code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Build web app
        run: npm run build

      - name: Sync Android project
        run: npx cap sync android

      - name: Install Gradle 8.14.3
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.14.3-bin.zip
          unzip -q gradle-8.14.3-bin.zip -d $HOME/gradle
          echo "$HOME/gradle/gradle-8.14.3/bin" >> $GITHUB_PATH

      - name: Restore upload keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > android/upload-keystore.jks
          test -f android/upload-keystore.jks
          echo "Upload keystore restored successfully."

      - name: Create signing properties
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          cat > android/signing.properties <<EOF
          storeFile=upload-keystore.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=proplead-upload
          keyPassword=$KEYSTORE_PASSWORD
          EOF

      - name: Configure Android signing
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path("android/app/build.gradle")
          text = path.read_text()

          signing_loader = '''def signingPropertiesFile = rootProject.file("signing.properties")
          def signingProperties = new Properties()
          if (signingPropertiesFile.exists()) {
              signingProperties.load(new FileInputStream(signingPropertiesFile))
          }

          '''

          if "signingPropertiesFile" not in text:
              text = text.replace(
                  "android {",
                  signing_loader + "android {",
                  1
              )

          if "signingConfigs {" not in text:
              signing_config = '''signingConfigs {
              release {
                  storeFile rootProject.file(signingProperties["storeFile"])
                  storePassword signingProperties["storePassword"]
                  keyAlias signingProperties["keyAlias"]
                  keyPassword signingProperties["keyPassword"]
              }
          }

          '''
              text = text.replace(
                  "buildTypes {",
                  signing_config + "buildTypes {",
                  1
              )
          else:
              text = text.replace(
                  'storeFile file(signingProperties["storeFile"])',
                  'storeFile rootProject.file(signingProperties["storeFile"])'
              )

          if "signingConfig signingConfigs.release" not in text:
              text = re.sub(
                  r'(buildTypes\s*\{\s*release\s*\{)',
                  r'\1\n            signingConfig signingConfigs.release',
                  text,
                  count=1
              )

          path.write_text(text)
          PY

      - name: Verify signing files
        run: |
          test -f android/upload-keystore.jks
          test -f android/signing.properties
          echo "Signing files are ready."

      - name: Build Android App Bundle
        working-directory: android
        run: gradle bundleRelease

      - name: Upload signed AAB
        uses: actions/upload-artifact@v4
        with:
          name: proplead-release-aab
          path: android/app/build/outputs/bundle/release/*.aab
